site_name: 日本版FIRE後の取り崩し戦略 〜 4%ルールを信じるな | たきびFIRE
site_url: https://takibi-fire.com/4percent-rule/
site_dir: dist
use_directory_urls: false

theme:
  language: ja
  name: material
  custom_dir: overrides
  favicon: imgs/favicon.png
  logo: imgs/takibi.png
  font:
    text: Noto Sans JP
    code: Roboto Mono
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - content.code.copy
    - content.tooltips
    - navigation.expand
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
    - toc.integrate

copyright: Copyright &copy; 2026 たきびFIRE

extra:
  analytics:
    provider: google
    property: G-0HHJ8YE8GZ
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TakibiFire/JapaneseTrinityStudy
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/takibi333
      name: たきび@FIRE
extra_css:
  - stylesheets/tailwind.css
  - stylesheets/extra.css

plugins:
  - search:
      lang: ja
      separator: '[\s\-\.]+'
  - git-revision-date-localized:
      type: datetime
      timezone: Asia/Tokyo
      locale: ja
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - markdown_include.include:
      base_path: docs
  - md_in_html
  - meta
  - pymdownx.arithmatex:
      generic: true
      smart_dollar: false
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji 
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tilde
  - pymdownx.striphtml:
      strip_comments: true
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - FIRE後の取り崩し戦略: index.md
  - 全解説: contents.md
  - 取り崩しシミュレーションにおいて考慮すべきこと:
    - ボラティリティの影響: volatility.md
    - 収益率配列のリスク: sequence.md
    - 物価上昇率の影響: cpi.md
    - 譲渡所得税の影響: tax.md
    - 信託報酬の影響: trust_fee.md
    - 為替リスクの影響: forex.md
    - 購買力平価とインフレの相関: ppp.md
  - 取り崩しにおける運用とポートフォリオ戦略:
    - ファットテール分布の影響: fat_tails.md
    - S&P500 vs. オルカン: sp500_vs_acwi.md
    - 現金保有の効果: cash_ratio.md
    - 現金リバランスの効果: cash_rebalance.md
    - 日本の無リスク資産の候補: zero_risk_options.md
    - 無リスク資産保有の効果: zero_risk.md
    - 無リスク資産リバランスの効果: zero_risk_rebalance.md
    - ダイナミックリバランス戦略: dynamic_rebalance.md
  - ライフプランを決めることの重要性:
    - 高齢になると支出が減る: retired_spending.md
    - 年金受給が取り崩し戦略に与える影響: pension.md
    - 死亡率を考慮する: mortality.md
    - ライフプランを考慮した<br>最適配分を繰り返す<br>（進化版ダイナミックリバランス）: spend_aware_dynamic_rebalance.md
  - 支出を減らす・収入を増やす:
    - ダイナミック・スペンディング<br>（動的支出）: dynamic_spending.md
    - ライフプランを考慮した<br>支出制限（生存確率ベース<br>のガードレール）: spend_aware_dynamic_spending.md
    - サイドFIRE: side_fire.md
  - 2人以上世帯・FAT FIREの年齢別最適戦略:
    - 60歳の最適戦略: all_60yr.md
    - 50歳の最適戦略: all_50yr.md
    - 40歳の最適戦略: all_40yr.md
  - 単身世帯・LEAN FIREの年齢別最適戦略:
    - 60歳の最適戦略: single_60yr.md
    - 50歳の最適戦略: single_50yr.md
    - 40歳の最適戦略: single_40yr.md
  - 公開未定:
    - NISA: nisa.md
    - iDeco: ideco.md
    - 証券担保ローン: loan.md
    - レバレッジをかけた商品: lebakan.md
    - ビットコイン: btc.md
